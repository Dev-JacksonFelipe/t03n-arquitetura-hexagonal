spring.datasource.url=jdbc:h2:mem:arq_software
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

spring.cloud.aws.region.static=us-east-1
# Credenciais AWS lidas automaticamente das variaveis de ambiente:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e, quando existir, AWS_SESSION_TOKEN.

# Filas
queue.order-events=T03N_JACKSON_FELIPE_LOPES.fifo

#aws.sqs.queue.saida-estoque=SQS-SAIDA-ESTOQUE.fifo
#aws.sqs.queue.entrada-estoque=SQS-ENTRADA-ESTOQUE.fifo
